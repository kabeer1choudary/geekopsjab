---

- name: Distribute and run shell script on Bastion host
  hosts: bastion
  gather_facts: no
  tasks:
    - name: Copy shell script to remote bastion
      copy:
        src: ./setup_nat_bstn.sh
        dest: /tmp/setup_nat_bstn.sh
        mode: '0755'

    - name: Run shell script on remote bastion
      become: yes
      become_user: root
      command: bash /tmp/setup_nat_bstn.sh
      register: remote_result

    - name: Show remote script output
      debug:
        var: remote_result.stdout

- name: Distribute and run shell script on Worker hosts
  hosts: worker
  gather_facts: no
  tasks:
    - name: Copy shell script to remote worker
      copy:
        src: ./setup_nat_wrk.sh
        dest: /tmp/setup_nat_wrk.sh
        mode: '0755'

    - name: Run shell script on remote worker
      command: bash /tmp/setup_nat_wrk.sh
      register: remote_result

    - name: Show remote script output
      debug:
        var: remote_result.stdout
