---
- name: Local setup tasks
  hosts: host
  gather_facts: no
  tasks:
    - name: Run VM provisioning script
      command: bash ./vm_provsioning.sh
      register: vm_provisioning_result

    # - name: Generate SSH key pair if not present
    #   openssh_keypair:
    #     path: "{{ lookup('env','HOME') }}/.ssh/id_ansible"
    #     type: rsa
    #     size: 2048
    #   register: ssh_key

    # - name: Display public key
    #   debug:
    #     msg: "{{ ssh_key.public_key }}"

- name: Distribute SSH keys and run remote tasks
  hosts: guest
  gather_facts: no
  tasks:
    - name: Copy public key to remote authorized_keys
      authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ hostvars['localhost']['ssh_key'].public_key }}"

    - name: Connectivity check (ping)
      ping:

    - name: Copy shell script to remote
      copy:
        src: ./setup_nat_wrk.sh
        dest: /tmp/remote_script.sh
        mode: '0755'

    - name: Run shell script on remote
      command: bash ./setup_nat_wrk.sh
      register: remote_result

    - name: Show remote script output
      debug:
        var: remote_result.stdout
